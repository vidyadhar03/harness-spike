[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "google-genai>=2.0",
  "google-cloud-firestore>=2.16",
  "google-cloud-storage>=2.16",
  "pypdfium2>=4.30",
  "pillow>=10",
  "json-repair>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4", "httpx>=0.27"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.scripts]
harness-memory = "harness.memory.cli:main"
harness-api = "harness.api.main:run"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
"harness.memory" = ["prompts/*.md"]
